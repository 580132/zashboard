# Fork-only: build dist in the cloud so no local toolchain is needed.
# Do NOT enable upstream deploy.yml here: it needs secrets.PAT and
# publishes to zephyruso names (ghcr.io/zephyruso/*, board.zash.run.place).
# Note: scheduled/manual runs keep Actions alive (workflows auto-disable
# after 60 days of repo inactivity).
name: Release Build

on:
  push:
    tags:
      - 'v*-singbox.*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Existing release tag to attach dist.zip to (empty = artifact only)'
        required: false
        default: ''
      refresh_lockfile:
        description: 'Maintenance only: generate lockfile artifact; do not build or publish'
        type: boolean
        required: false
        default: false
      upstream_tag:
        description: 'Optional upstream release tag to seed security updates when refreshing lockfile'
        required: false
        default: ''
      verify_setup:
        description: 'Run browser regression tests for URL and same-origin setup after a manual build'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sing-box restore intact
        run: |
          grep -q "Singbox" src/assembly/backend.ts
          test -f src/api/singbox/client.ts

      - name: Build
        run: pnpm run build

      - name: Verify URL and same-origin setup in headless Chrome
        if: github.event_name == 'workflow_dispatch' && inputs.verify_setup
        run: pnpm test:setup

      - name: Zip dist
        run: zip -r dist.zip dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # NOTE: must not use github.ref_name here (branch names like
          # chore/sync-upstream contain '/' which artifact names reject).
          name: dist-${{ github.run_number }}
          path: dist.zip

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist.zip

      - name: Attach to release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release != ''
        run: gh release upload "${{ inputs.upload_to_release }}" dist.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes dist to the gh-pages branch so sing-box can fetch the UI from
  # https://github.com/580132/zashboard/archive/refs/heads/gh-pages.zip
  # (same mechanism as upstream). No CNAME: the fork must not claim
  # upstream's board.zash.run.place domain.
  deploy-pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.refresh_lockfile && inputs.upload_to_release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_number }}
          path: pkg

      - name: Unzip dist
        run: unzip -q pkg/dist.zip -d pkg && test -f pkg/dist/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pkg/dist
          publish_branch: gh-pages
          force_orphan: true

  # Artifact-only maintenance mode: no branch commits, releases or gh-pages writes.
  lockfile:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Seed upstream lockfile for security updates
        if: inputs.upstream_tag != ''
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an upstream vX.Y.Z release tag.' >&2
            exit 1
          fi
          git fetch --depth=1 --no-tags https://github.com/Zephyruso/zashboard.git "refs/tags/$UPSTREAM_TAG"
          git show FETCH_HEAD:package.json > "$RUNNER_TEMP/upstream-package.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const local = JSON.parse(readFileSync("package.json", "utf8"));
            const upstream = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/upstream-package.json", "utf8"));
            assert.equal(local.version, upstream.version, "Upstream tag must match the merged package version");
          '
          git show FETCH_HEAD:pnpm-lock.yaml > pnpm-lock.yaml

      - name: Regenerate for merged dependencies, including sing-box and Tools
        env:
          HUSKY: '0'
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Verify frozen lockfile and unchanged manifest
        env:
          HUSKY: '0'
        run: |
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json

      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-${{ github.run_number }}
          path: pnpm-lock.yaml
          if-no-files-found: error
